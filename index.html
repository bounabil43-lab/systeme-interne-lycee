<script>
const sourceLines = ["النظام الداخلي للمؤسسة", "الفصل الأول: أحكام عامة", "المادة الأولى: يهدف النظام الداخلي إلى تحديد الضوابط العامة لتسيير الحياة المدرسية، وضمان السير الحسن والمستقر للنشاطات داخل مؤسسة التربية والتعليم، في جو ملائم يسوده الانضباط ويضمن تحقيق الأهداف التربوية المسطرة.", "المادة 2: يرتكز النظام الداخلي على مبادئ الخدمة العمومية للتربية والتعليم، والقيم الوطنية والدينية والاجتماعية للشعب الجزائري، لاسيما ترسيخ قيم المواطنة والمسؤولية والأمانة والقدوة المثالية، ونبذ العنف بكل أشكاله الجسدية واللفظية والمعنوية.", "المادة 3: النظام الداخلي وثيقة تنظيمية مكتوبة ومقننة ومُلزمة، تحدد الضوابط السلوكية والتربوية والوقائية، وحقوق وواجبات أفراد الجماعة التربوية.", "يلتزم أفراد الجماعة التربوية بالاطلاع على أحكامه وتطبيقها.", "الفصل الثاني تنظيم مؤسسة التربية والتعليم وسيرها", "المادة 4: يفتح الباب الرئيسي للمؤسسة التعليمية قبل انطلاق الدروس بخمس عشرة (15) دقيقة، ويُغلق قبل خمس (05) دقائق من موعد تحية العلم.", "لا تتحمل إدارة المؤسسة أي مسؤولية عن التلاميذ خارج أسوار المؤسسة التعليمية، وذلك في حدود ما تنص عليه التشريعات والتنظيمات المعمول بها.", "المادة 5: يمكن لمدير مؤسسة التربية والتعليم تعديل مواقيت دخول وخروج التلاميذ والغلق في حالات استثنائية، بالتنسيق مع مديرية التربية.", "المادة 6: إلزامية رفع العلم الوطني وخفضه يومياً، مصحوباً بأداء النشيد الوطني.", "يشارك في رفع العلم الوطني وخفضه كافة التلاميذ والموظفين، تحت إشراف مدير المؤسسة التربوية؛", "وضع اللافتة الحاملة لتسمية المؤسسة التعليمية بمدخلها الرئيسي، وتثبيت العلم الوطني وفق الشروط والمعايير المحددة في التنظيمات السارية المفعول.", "المادة 7: يمنع تسريح تلاميذ التربية التحضيرية والتعليم الابتدائي، في حالة غياب الأستاذ، قبل مواعيد الخروج الرسمية، ويقع عبء تأطيرهم على المربين المتخصصين.", "المادة 8: لا يسمح بالدخول إلى فضاءات المؤسسة التعليمية ومختلف محلاتها ومرافقها إلا للأشخاص المرخص لهم قانوناً.", "يخضع دخول الزوار وأولياء التلاميذ إلى المؤسسة لمواقيت الاستقبال المحددة والمبرمجة رسمياً، مع إلزامية استظهار وثيقة هوية رسمية وحمل شارة الزائر طوال مدة تواجدهم داخل المؤسسة.", "المادة 9: تخضع حركة التلاميذ في الساحة، الأروقة والممرات، لتأطير ومراقبة مستمرة من الطاقم الإداري والتربوي وفق جداول حراسة دورية معتمدة.", "يُمنع تجوال التلاميذ في أروقة المؤسسة أثناء الحصص الدراسية، كما يُمنع بقاؤهم داخل الأقسام خلال فترات الاستراحة، إلا لضرورة تقتضي ذلك، وتحت إشراف ومرافقة مؤطر.", "المادة 10: تضبط الاستراحة حسب ساحة المؤسسة، وتستمر الاستراحة الصباحية والمسائية في الأيام العادية لمدة عشر (10) دقائق في التعليم المتوسط والثانوي، ولا يسمح للتلاميذ بالمكوث في القاعات أو البقاء في الأروقة خلال هذه الفترة.", "المادة 11: تسهر إدارة المؤسسة التعليمية على حسن سير وحدة الكشف والمتابعة لتقديم الرعاية الصحية للتلاميذ بانتظام وبصفة دورية.", "المادة 12: تشجع المؤسسة التعليمية انخراط التلاميذ في النوادي المدرسية والثقافية والرياضية المدرسية لتنمية مواهبهم.", "المادة 13: تسهر المؤسسة التعليمية على تنظيم وتأطير النشاطات الرياضية والعلمية والثقافية والترفيهية والخرجات البيداغوجية المعتمدة، بالتنسيق مع الأولياء والجهات الوصية، بما يدعم الانفتاح المعرفي للتلاميذ وتنمية شخصيتهم.", "الفصل الثالث تنظيم الحياة المدرسية", "المادة 14: يلتزم التلاميذ والموظفون بتطبيق جداول التوقيت الرسمية والأنشطة المقررة.", "المادة 15: تتابع إدارة المؤسسة التعليمية غيابات التلاميذ وتأخراتهم، وتدوينها في السجلات الرسمية لذلك، مع إرسال إشعارات للأولياء بكل طرق التواصل المتاحة.", "لا يسمح للتلميذ المتغيب باستئناف الدروس إلا بعد تقديم رخصة دخول مسلمة من المصلحة البيداغوجية؛", "تبرر الغيابات بحضور الولي أو الوصي الشرعي أو تقديم شهادة طبية تبرر العجز، خلال 48 ساعة من تاريخ الغياب، ويترتب على الغيابات غير المبررة إنذارات مكتوبة تحفظ في ملف التلميذ.", "المادة 16: يترتب عن التأخرات المتكررة، ثلاث (3) مرات متتالية للتلميذ، على الأقل، إلى توجيه إعذار كتابي للولي، والالتزام بحضوره الشخصي لتسوية الوضعية البيداغوجية للتلميذ.", "المادة 17: تنظم المؤسسة التعليمية وتؤطر حصص المذاكرة والمراجعة الجماعية للدروس داخل الفضاءات المخصصة لها.", "المادة 18: تحرص إدارة المؤسسة التعليمية والأساتذة على برمجة وتنفيذ:", "* تشخيص ومعالجة صعوبات التعلم لدى التلاميذ؛", "الدعم البيداغوجي خلال الأسبوع الأول من عطلتي الشتاء والربيع لفائدة تلاميذ الامتحانات الرسمية.", "المادة 19: تخضع مكتسبات التلاميذ لتقييمات دورية مستمرة وفق الرزنامة والتعليمات الرسمية.", "المادة 20: في حالة غياب التلميذ عن فرض أو اختبار فضلي بمبرر مقبول، يلتزم الأستاذ بالتنسيق مع إدارة المؤسسة بإعادة الفرض أو الاختبار في آجال مناسبة، أما في حالة عدم تقديم المبرر تمنح له علامة الصفر (00).", "المادة 21: تمنح علامة الصفر (00) مباشرة للتلميذ في حالة ثبوت الغش أو محاولة الغش أو التزوير في أي تقييم أو اختبار، مع إحالته فوراً على مجلس التأديب (في مرحلتي التعليم المتوسط والتعليم الثانوي العام والتكنولوجي) لتطبيق العقوبات المنصوص عليها في التنظيم المعمول به.", "المادة 22: يُمنح الإعفاء من ممارسة التربية البدنية والرياضية لأسباب صحية وبناءً على شهادة طبية من طبيب الصحة المدرسية أو طبيب محلف، عند الاقتضاء، ولا يعتبر، في هذه الحالة، الاعفاء من النشاط البدني اعفاء من الحصة.", "الفصل الرابع تنظيم المطعم المدرسي والنظامين الداخلي ونصف الداخلي والنقل المدرسي", "المادة 23: يستفيد التلاميذ المسجلون في قوائم الإطعام بصفة مجانية أو نظامية من وجبة صحية متوازنة وساخنة يومياً خلال السنة الدراسية.", "المادة 24: تلتزم المصالح المالية والإدارية وأعوان المطبخ بالتقيد الصارم بقواعد الصحة والنظافة والسلامة الغذائية، لاسيما:", "فرض ارتداء المئزر والقفازات وواقي الشعر والأحذية البلاستيكية لجميع الطباخين ومساعديهم، مع إخضاعهم لفحوصات وتحاليل طبية دورية؛", "إلزامية الاحتفاظ بالوجبة الشاهدة بجميع مكوناتها الغذائية لمدة خمسة (5) أيام متتالية من تاريخ الاستهلاك لأسباب رقابية وصحية؛", "عدم استلام اللحوم بكافة أنواعها إلا بعد الحصول على رخصة وإجازة بيطرية رسمية تثبت سلامتها وصلاحيتها للاستهلاك؛", "التقيد الصارم بجدول التغذية الأسبوعي المعتمد والمؤشر عليه من طبيب وحدة الكشف والمتابعة؛", "منع استهلاك التبغ، بكل أنواعه، منعاً باتاً داخل قاعة الإطعام، قاعة الطبخ، ومخازن الأغذية.", "المادة 25: يلتزم التلاميذ بتناول وجباتهم الغذائية بهدوء وتجنب إحداث الضجيج أو تبذير الطعام.", "يمنع إدخال أو إخراج الأطعمة من المطعم.", "يتحمل الولي أو الوصي الشرعي الكلفة المالية لأي إتلاف متعمد لأدوات الأكل والأواني.", "المادة 26: يخضع التلاميذ المستفيدون من النظامين الداخلي أو نصف الداخلي لضوابط المراقبة والحراسة المستمرة أثناء فترات تواجدهم بالمؤسسة التعليمية، المطعم أو بالمراقد، من طرف سلك مساعدي ومشرفي التربية في المتوسط والثانوي والمربي المتخصص في الابتدائي.", "المادة 27: تسهر المؤسسة التعليمية بالتنسيق مع الجماعات المحلية على تأطير خدمات النقل المدرسي.", "تخضع الرحلات والخرجات البيداغوجية إلى الترخيص المسبق والتأطير اللازمين.", "الفصل الخامس الوقاية، الصحة، النظافة والأمن", "المادة 28: يشارك مدير المؤسسة التعليمية، بالتنسيق مع مصالح الحماية المدنية، في إعداد مخططات الوقاية والأمن وتنظيم التدخلات والإسعافات في حالات الكوارث الطبيعية والمخاطر الكبرى، ويعلق هذا المخطط وجوباً في أماكن بارزة بالمؤسسة التعليمية.", "المادة 29: في حالة وقوع حوادث أو اضطرابات تهدد أمن الأشخاص والممتلكات، يقوم مدير المؤسسة باتخاذ التدابير الاستعجالية الضرورية بالتنسيق مع المصالح المعنية.", "المادة 30: يلتزم مدير المؤسسة التعليمية وأفراد الجماعة التربوية بالتبليغ عن كل وضعية من شأنها المساس بحقوق الطفل أو سلامته، وفقاً للتشريع والتنظيم المعمول بها، ولا سيما إخطار الهيئة الوطنية لحماية وترقية الطفولة عن طريق الخط الأخضر 1111، عند الاقتضاء، مع مراعاة مصلحة الطفل الفضلى والسرية المهنية.", "المادة 31: يساهم التلاميذ وكافة أعضاء الجماعة التربوية في الحفاظ على نظافة المؤسسة التعليمية، والمشاركة التطوعية في تزيينها وزرع المساحات الخضراء لحماية البيئة المدرسية.", "المادة 32: يمنع على التلاميذ جلب وإحضار الأشياء الثمينة والمبالغ المالية وغيرها، ولا تتحمل المؤسسة التعليمية أي مسؤولية في حالة ضياعها أو سرقتها.", "المادة 33: يلتزم أفراد الجماعة التربوية بالحضور بمظهر نظيف وهندام لائق، لا يخالف الآداب العامة، ويتيح التعرف عليهم، ويتناسب مع وقار المؤسسة التربوية.", "يمنع منعاً باتاً على التلاميذ الظهور بقصات شعر غريبة أو استعمال مساحيق الزينة، أو ارتداء القبعات والملابس الممزقة والمنافية للآداب العامة.", "المادة 34: يلتزم الطاقم البيداغوجي في مرحلة التعليم الابتدائي بإجراء فحص صباحي دوري لنظافة الجسم والأظافر والشعر للتلاميذ كإجراء صحي وقائي.", "المادة 35: يُحظر في المؤسسة التعليمية كل السلوكيات المنافية للآداب العامة، لا سيما:", "حيازة، إدخال، أو استعمال الأسلحة البيضاء والقوارير والأنابيب الزجاجية، المفرقعات، الألعاب النارية، أو أي أدوات أو مواد تشكل خطراً على سلامة أعضاء الجماعة التربوية وأمن المؤسسة التعليمية؛", "حيازة، استهلاك، أو ترويج كافة أنواع التبغ، السجائر الإلكترونية، المخدرات، والمؤثرات العقلية، ومشروبات الطاقة، في الوسط المدرسي؛", "الترويج أو الانخراط في التحديات الرقمية الخطيرة.", "المادة 36: يخضع تلاميذ مؤسسات التربية والتعليم، باستثناء تلاميذ مرحلة التعليم الابتدائي، ما لم تقتض ذلك مصلحتهم الفضلى، إلى تحاليل الكشف عن تعاطي المخدرات و/أو المؤثرات العقلية.", "المادة 37: يمكن مدير المؤسسة التعليمية أن يطلب إجراء تحاليل الكشف عن تعاطي المخدرات و/أو المؤثرات العقلية من طرف أطباء وحدات الكشف والمتابعة وفقا للمرسوم التنفيذي رقم 26-77 المؤرخ في 25 رجب عام 1447 الموافق 14 جانفي سنة 2026 الذي يحدد شروط وكيفيات الكشف عن تعاطي المخدرات و/أو المؤثرات العقلية بالمؤسسات التربوية والتعليمية والتكوينية، في حالتين:", "إدراج التحاليل ضمن الفحوص الدورية المبرمجة مع وحدات الكشف والمتابعة؛", "ظهور اختلال في السلوك أو سلوك عدواني لدى التلميذ تجاه زملائه و/أو الأساتذة و/أو الطاقم الاداري، أو وجود اشتباه معقول على تعاطيه المخدرات و/أو المؤثرات العقلية وفقا لملاحظات الأساتذة و/ أو الطاقم الإداري وكذا أطباء وحدات الكشف والمتابعة أثناء الفحوصات الصحية الدورية.", "المادة 38: تخضع كيفية إجراء تحاليل الكشف عن تعاطي المخدرات و/أو المؤثرات العقلية للإجراءات التالية:", "بالنسبة للتلميذ القاصر: يتولى مدير المؤسسة التعليمية استدعاء الولي أو الوصي الشرعي، وعرض الحالة عليه للتشاور بشأن التدابير المناسبة الواجب اتخاذها، مع اشتراط الحصول على موافقته الكتابية والواضحة على إخضاع التلميذ لإجراء التحاليل. وفي حال رفضه، يطلب مدير المؤسسة مباشرة أو عبر مديرية التربية، موافقة قاضي الأحداث المختص إقليمياً مع إشعار الممثل الشرعي بذلك؛", "بالنسبة للتلميذ البالغ سن الرشد المدني: يطلب مدير المؤسسة التعليمية موافقته الشخصية على إجراء التحاليل في حضور وليه أو وصيه الشرعي، وفي حال امتناعه عن الموافقة ضمن الآجال المحددة، يُخطر بأن هذا الامتناع يؤدي وجوباً إلى إحالته على المجلس التأديبي.", "المادة 39: إذا أظهرت نتائج التحاليل وجود تعاطي المخدرات و/أو المؤثرات العقلية، يُعلَم الولي أو الوصي الشرعي للتلميذ القاصر بذلك، وعند الاقتضاء، قاضي الأحداث الذي وافق على إخضاع التلميذ للتحليل، كما يُعلَم التلميذ البالغ سن الرشد المدني بذلك.", "المادة 40: يُعلَم الولي أو الوصي الشرعي للتلميذ القاصر، أو التلميذ البالغ سن الرشد المدني، بوجوب الخضوع للتدابير العلاجية المنصوص عليها في القانون رقم 04-18 المؤرخ في 13 ذي القعدة عام 1425 الموافق 25 ديسمبر سنة 2004، المتعلق بالوقاية من المخدرات والمؤثرات العقلية وقمع الاستعمال والاتجار غير المشروعين بها، المعدل والمتمم.", "المادة 41: يمنع منعاً باتاً اتخاذ أي إجراءات عقابية، تأديبية، إقصائية، أو تهميش بيداغوجي من طرف إدارة المؤسسة ضد التلميذ الذي تظهر نتائج تحاليله إيجابية.", "يخضع كل ما يتعلق بإجراءات التحاليل ونتائجها للسرية المهنية التامة. ويتعرّض كل شخص يقوم بإفشاء المعلومات المرتبطة بها أو يمس بالحياة الخاصة للتلميذ إلى العقوبات المنصوص عليها في التشريع والتنظيم المعمول بهما.", "الفصل السادس تقنين استعمال وسائل الإعلام والاتصال المؤسساتية والشخصية", "المادة 42: تُستعمل أجهزة الإعلام الآلي واللوحات الإلكترونية التابعة للمؤسسة التربوية للأغراض التعليمية والبيداغوجية حصراً، وتحت الإشراف المباشر للأستاذ المسؤول، مع ضرورة المحافظة على سلامة التجهيزات والبرمجيات المعتمدة.", "المادة 43: يُمنع منعاً باتاً على التلاميذ إحضار أو استعمال الهواتف النقالة الشخصية، وأجهزة الاتصال الذكية، أو وسائل التصوير والتسجيل داخل قاعات الدراسة والمرافق البيداغوجية.", "وفي حالة الضرورة البيداغوجية القصوى، يخضع استعمال وسائل تكنولوجيات الإعلام والاتصال لترخيص كتابي مسبق تسلمه إدارة المؤسسة التعليمية. ويترتب على مخالفة هذه الأحكام حجز الجهاز مؤقتاً واستدعاء الولي.", "المادة 44: يُمنع منعاً باتاً إجراء أي تصوير، أو تسجيل سمعي أو بصري، أو نشر صور تخص التلاميذ أو الأساتذة أو الموظفين أو مرافق المؤسسة التعليمية على شبكات التواصل الاجتماعي أو الأنظمة الرقمية الشخصية، دون الحصول على ترخيص رسمي كتابي من مدير التربية.", "يلتزم الجميع باحترام خصوصية أفراد الجماعة التربوية وقواعد السر المهني.", "الفصل السابع الحقوق والواجبات", "المادة 45: يتمتع التلاميذ بالحقوق التالية:", "التعلم واكتساب المعارف والمهارات والقيم؛", "المساواة وتكافؤ الفرص بين الجميع، بما في ذلك التلاميذ ذوو الاحتياجات الخاصة؛", "الاستفادة من الحصص الدراسية المقررة وفق البرامج والمقررات الرسمية؛", "حسن الاستقبال والحماية من كل أشكال العنف أو التمييز؛", "السلامة الجسدية والمعنوية؛", "المتابعة الطبية بالتنسيق مع المصالح المختصة؛", "حرية التعبير في إطار التشريع والتنظيم المعمول بهما؛", "التمثيل من طرف مندوبي الأقسام؛", "الإعلام والاتصال.", "المادة 46: يلتزم التلاميذ بالواجبات والضوابط التالية:", "احترام قواعد الانضباط والمواظبة؛", "استظهار بطاقة التلميذ أو دفتر المراسلة عند الدخول إلى المؤسسة التعليمية في مرحلتي التعليم المتوسط والثانوي؛", "ارتداء المئزر المدرسي طوال فترة تواجده بالمؤسسة؛", "الالتزام بارتداء لباس نظيف ولائق ومناسب للوسط المدرسي؛", "ضرورة احضار الأدوات والكتب المدرسية والبدلة الرياضية، حسب الجدول الزمني؛", "احترام كافة أعضاء الجماعة التربوية؛", "الامتناع عن كل شكل من أشكال العنف المخل بالنظام العام للمؤسسة؛", "الامتناع عن تعاطي المخدرات و/أو المؤثرات العقلية؛", "الامتناع عن كل أنواع الغش والتزوير؛", "الامتناع عن استهلاك التبغ، بكل أنواعه، داخل مؤسسة التربية والتعليم؛", "المحافظة على الهياكل والتجهيزات والوسائل التعليمية؛", "المحافظة على نظافة المؤسسة ومحيطها.", "المادة 47: يستفيد الموظفون من الحقوق الآتية:", "احترام كرامتهم ومكانتهم المهنية؛", "المشاركة في تسيير مؤسسة التربية والتعليم ضمن أطر المجالس والنصوص المنظمة؛", "المشاركة في مختلف العمليات التكوينية؛", "الإعلام والاتصال؛", "ممارسة النشاط النقابي وفقاً للأحكام التشريعية والتنظيمية المعمول بها، دون المساس باستمرار الخدمة العمومية.", "المادة 48: يلتزم الموظفون والأساتذة بالواجبات الآتية:", "تطبيق المناهج والبرامج التعليمية والمواقيت والتوجيهات الرسمية؛", "تبني المقاربات البيداغوجية المنصوص عليها في البرامج، ووضعيات التعليم والتعلم التي تسمح بالمشاركة التفاعلية للتلاميذ؛", "المشاركة في مختلف المجالس البيداغوجية والإدارية المنظمة للحياة المدرسية، وكذا في الاجتماعات المنعقدة داخل مؤسسة التربية والتعليم؛", "اعتماد الأساليب التربوية المناسبة في تعاملهم مع التلاميذ، ونبذ كل شكل من أشكال الإساءة أو الإهانة اللفظية والمعنوية التي يمكن أن تمس بشخصهم وكرامتهم؛", "التحلي بسلوك مثالي والالتزام بارتداء لباس لائق معية أولياء التلاميذ، باعتبارها همزة وصل بين الأسرة والمؤسسة التعليمية، وتوطيد العلاقة بينهما.", "يمكن لجمعية أولياء التلاميذ الإعلان عن برامج أنشطتها داخل المؤسسة التعليمية، وذلك بعد موافقة إدارة المؤسسة، التي تحدد بدورها الفضاء المخصص لهذا الغرض.", "الفصل الثامن أحكام خاصة", "المادة 52: تتكفل المؤسسة التعليمية بالتلاميذ ذوي الاحتياجات الخاصة أو الذين يعانون من أمراض مزمنة، وذلك بتقديم الرعاية التربوية والبيداغوجية الملائمة، وتسهيل إدماجهم، ومراعاة ظروفهم الصحية الخاصة أثناء اجتياز الفروض والاختبارات وحصص التربية البدنية والرياضية، بناءً على تقارير طبية معتمدة، مع الالتزام التام بواجب التحفظ والسرية.", "المادة 53: في حالة وقوع حادث مدرسي لأي تلميذ داخل المؤسسة التعليمية أو أثناء نشاط خارجي مرخص، تلتزم الإدارة باتخاذ الإجراءات الفورية لتقديم الإسعافات الأولية ونقله إلى المصالح الصحية، وإعلام الأولياء، وتبليغ مدير التربية، والقيام بالتصريح القانوني بالحادث لدى تعاضدية الحوادث المدرسية في الآجال المحددة.", "المادة 54: يتوجب على مدير المؤسسة التحلي باليقظة، وتكريس واجب إخطار مدير التربية والسلطات المعنية في حالة وجود خطر أو الاشتباه في وجوده، من شأنه المساس بالسلامة الجسدية أو النفسية أو الاجتماعية أو الأخلاقية للتلميذ.", "الفصل التاسع أحكام ختامية", "المادة 55: يُشهر النظام الداخلي داخل المؤسسة، ويُتاح إلكترونياً ضمن حسابات مديري المؤسسات التعليمية وأساتذتها، وكذا عبر فضاء الأولياء، بما يضمن تمكين أفراد الجماعة التربوية من الاطلاع على أحكامه."];

 chapters.forEach((c,i)=>{
  const b=document.createElement("button"); b.className="chapter";
  b.innerHTML="<span class='muted'>الفصل "+(i+1)+"</span><strong>"+c+"</strong><span class='muted'>اضغط لعرض مواد الفصل</span>";
  b.onclick=()=>openChapter(i); ch.appendChild(b);
 });
}
function findArticles(ci){
 const start=sourceLines.findIndex(x=>x.includes(chapters[ci].slice(0,18)));
 let end=sourceLines.length;
 for(let j=ci+1;j<chapters.length;j++){
   const k=sourceLines.findIndex(x=>x.includes(chapters[j].slice(0,18)));
   if(k>start){end=k;break}
 }
 return sourceLines.slice(Math.max(0,start),end);
}
function openChapter(ci,ai=0){
 currentChapter=ci; currentArticle=ai;
 const lines=findArticles(ci);
 title.textContent=chapters[ci];
 articles.innerHTML="";
 lines.forEach(x=>{
   const d=document.createElement("div");d.className="article";
   d.innerHTML=x.match(/^المادة/) ? "<b>"+x+"</b>" : x;
   articles.appendChild(d);
 });
 viewer.classList.remove("hidden"); viewer.scrollIntoView({behavior:"smooth"});
}
document.getElementById("home").onclick=()=>{viewer.classList.add("hidden");renderChapters();};
document.getElementById("prev").onclick=()=>{if(currentChapter>0)openChapter(currentChapter-1)};
document.getElementById("next").onclick=()=>{if(currentChapter<chapters.length-1)openChapter(currentChapter+1)};
document.getElementById("search").oninput=e=>{
 const q=e.target.value.trim().toLowerCase(); if(!q){renderChapters();return}
 ch.innerHTML="";
 sourceLines.filter(x=>x.toLowerCase().includes(q)).slice(0,80).forEach(x=>{
   const b=document.createElement("button");b.className="chapter";
   b.innerHTML="<strong>"+x+"</strong><span class='muted'>نتيجة البحث</span>";
   b.onclick=()=>{viewer.classList.remove("hidden");title.textContent="نتيجة البحث";articles.innerHTML="<div class='article'>"+x+"</div>"};
   ch.appendChild(b);
 });
};
let deferred;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;document.getElementById("install").classList.remove("hidden")});
document.getElementById("install").onclick=async()=>{if(deferred){deferred.prompt();deferred=null}};
if("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js");
renderChapters();
</script>
</body></html>
