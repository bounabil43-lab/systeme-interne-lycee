ary);font-size:16px}.reader-nav{display:flex;gap:8px;padding:0 16px 16px}.reader-nav button{flex:1;border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:12px;padding:9px;font-weight:800}.reader-nav button:hover{border-color:#b8d1d4}body.dark .reader-head{background:rgba(20,36,42,.94)}body.dark .article-head{background:linear-gradient(90deg,#193b3b,#17282d)}

<script>
const sourceLines=["النظام الداخلي للمؤسسة", "الفصل الأول: أحكام عامة", "المادة الأولى: يهدف النظام الداخلي إلى تحديد الضوابط العامة لتسيير الحياة المدرسية، وضمان السير الحسن والمستقر للنشاطات داخل مؤسسة التربية والتعليم، في جو ملائم يسوده الانضباط ويضمن تحقيق الأهداف التربوية المسطرة.", "المادة 2: يرتكز النظام الداخلي على مبادئ الخدمة العمومية للتربية والتعليم، والقيم الوطنية والدينية والاجتماعية للشعب الجزائري، لاسيما ترسيخ قيم المواطنة والمسؤولية والأمانة والقدوة المثالية، ونبذ العنف بكل أشكاله الجسدية واللفظية والمعنوية.", "المادة 3: النظام الداخلي وثيقة تنظيمية مكتوبة ومقننة ومُلزمة، تحدد الضوابط السلوكية والتربوية والوقائية، وحقوق وواجبات أفراد الجماعة التربوية.", "يلتزم أفراد الجماعة التربوية بالاطلاع على أحكامه وتطبيقها.", "الفصل الثاني تنظيم مؤسسة التربية والتعليم وسيرها", "المادة 4: يفتح الباب الرئيسي للمؤسسة التعليمية قبل انطلاق الدروس بخمس عشرة (15) دقيقة، ويُغلق قبل خمس (05) دقائق من موعد تحية العلم.", "لا تتحمل إدارة المؤسسة أي مسؤولية عن التلاميذ خارج أسوار المؤسسة التعليمية، وذلك في حدود ما تنص عليه التشريعات والتنظيمات المعمول بها.", "المادة 5: يمكن لمدير مؤسسة التربية والتعليم تعديل مواقيت دخول وخروج التلاميذ والغلق في حالات استثنائية، بالتنسيق مع مديرية التربية.", "المادة 6: إلزامية رفع العلم الوطني وخفضه يومياً، مصحوباً بأداء النشيد الوطني.", "يشارك في رفع العلم الوطني وخفضه كافة التلاميذ والموظفين، تحت إشراف مدير المؤسسة التربوية؛", "وضع اللافتة الحاملة لتسمية المؤسسة التعليمية بمدخلها الرئيسي، وتثبيت العلم الوطني وفق الشروط والمعايير المحددة في التنظيمات السارية المفعول.", "المادة 7: يمنع تسريح تلاميذ التربية التحضيرية والتعليم الابتدائي، في حالة غياب الأستاذ، قبل مواعيد الخروج الرسمية، ويقع عبء تأطيرهم على المربين المتخصصين.", "المادة 8: لا يسمح بالدخول إلى فضاءات المؤسسة التعليمية ومختلف محلاتها ومرافقها إلا للأشخاص المرخص لهم قانوناً.", "يخضع دخول الزوار وأولياء التلاميذ إلى المؤسسة لمواقيت الاستقبال المحددة والمبرمجة رسمياً، مع إلزامية استظهار وثيقة هوية رسمية وحمل شارة الزائر طوال مدة تواجدهم داخل المؤسسة.", "المادة 9: تخضع حركة التلاميذ في الساحة، الأروقة والممرات، لتأطير ومراقبة مستمرة من الطاقم الإداري والتربوي وفق جداول حراسة دورية معتمدة.", "يُمنع تجوال التلاميذ في أروقة المؤسسة أثناء الحصص الدراسية، كما يُمنع بقاؤهم داخل الأقسام خلال فترات الاستراحة، إلا لضرورة تقتضي ذلك، وتحت إشراف ومرافقة مؤطر.", "المادة 10: تضبط الاستراحة حسب ساحة المؤسسة، وتستمر الاستراحة الصباحية والمسائية في الأيام العادية لمدة عشر (10) دقائق في التعليم المتوسط والثانوي، ولا يسمح للتلاميذ بالمكوث في القاعات أو البقاء في الأروقة خلال هذه الفترة.", "المادة 11: تسهر إدارة المؤسسة التعليمية على حسن سير وحدة الكشف والمتابعة لتقديم الرعاية الصحية للتلاميذ بانتظام وبصفة دورية.", "المادة 12: تشجع المؤسسة التعليمية انخراط التلاميذ في النوادي المدرسية والثقافية والرياضية المدرسية لتنمية مواهبهم.", "المادة 13: تسهر المؤسسة التعليمية على تنظيم وتأطير النشاطات الرياضية والعلمية والثقافية والترفيهية والخرجات البيداغوجية المعتمدة، بالتنسيق مع الأولياء والجهات الوصية، بما يدعم الانفتاح المعرفي للتلاميذ وتنمية شخصيتهم.", "الفصل الثالث  تنظيم الحياة المدرسية", "المادة 14: يلتزم التلاميذ والموظفون بتطبيق جداول التوقيت الرسمية والأنشطة المقررة.", "المادة 15: تتابع إدارة المؤسسة التعليمية غيابات التلاميذ وتأخراتهم، وتدوينها في السجلات الرسمية لذلك، مع إرسال إشعارات للأولياء بكل طرق التواصل المتاحة.", "لا يسمح للتلميذ المتغيب باستئناف الدروس إلا بعد تقديم رخصة دخول مسلمة من المصلحة البيداغوجية؛", "تبرر الغيابات بحضور الولي أو الوصي الشرعي أو تقديم شهادة طبية تبرر العجز، خلال 48 ساعة من تاريخ الغياب، ويترتب على الغيابات غير المبررة إنذارات مكتوبة تحفظ في ملف التلميذ.", "المادة 16: يترتب عن التأخرات المتكررة، ثلاث (3) مرات متتالية للتلميذ، على الأقل، إلى توجيه إعذار كتابي للولي، والالتزام بحضوره الشخصي لتسوية الوضعية البيداغوجية للتلميذ.", "المادة 17: تنظم المؤسسة التعليمية وتؤطر حصص المذاكرة والمراجعة الجماعية للدروس داخل الفضاءات المخصصة لها.", "المادة 18: تحرص إدارة المؤسسة التعليمية والأساتذة على برمجة وتنفيذ:", "* تشخيص ومعالجة صعوبات التعلم لدى التلاميذ؛", "الدعم البيداغوجي خلال الأسبوع الأول من عطلتي الشتاء والربيع لفائدة تلاميذ الامتحانات الرسمية.", "المادة 19: تخضع مكتسبات التلاميذ لتقييمات دورية مستمرة وفق الرزنامة والتعليمات الرسمية.", "المادة 20: في حالة غياب التلميذ عن فرض أو اختبار فضلي بمبرر مقبول، يلتزم الأستاذ بالتنسيق مع إدارة المؤسسة بإعادة الفرض أو الاختبار في آجال مناسبة، أما في حالة عدم تقديم المبرر تمنح له علامة الصفر (00).", "المادة 21: تمنح علامة الصفر (00) مباشرة للتلميذ في حالة ثبوت الغش أو محاولة الغش أو التزوير في أي تقييم أو اختبار، مع إحالته فوراً على مجلس التأديب (في مرحلتي التعليم المتوسط والتعليم الثانوي العام والتكنولوجي) لتطبيق العقوبات المنصوص عليها في التنظيم المعمول به.", "المادة 22: يُمنح الإعفاء من ممارسة التربية البدنية والرياضية لأسباب صحية وبناءً على شهادة طبية من طبيب الصحة المدرسية أو طبيب محلف، عند الاقتضاء، ولا يعتبر، في هذه الحالة، الاعفاء من النشاط البدني اعفاء من الحصة.", "الفصل الرابع  تنظيم المطعم المدرسي والنظامين الداخلي ونصف الداخلي والنقل المدرسي", "المادة 23: يستفيد التلاميذ المسجلون في قوائم الإطعام بصفة مجانية أو نظامية من وجبة صحية متوازنة وساخنة يومياً خلال السنة الدراسية.", "المادة 24: تلتزم المصالح المالية والإدارية وأعوان المطبخ بالتقيد الصارم بقواعد الصحة والنظافة والسلامة الغذائية، لاسيما:", "فرض ارتداء المئزر والقفازات وواقي الشعر والأحذية البلاستيكية لجميع الطباخين ومساعديهم، مع إخضاعهم لفحوصات وتحاليل طبية دورية؛", "إلزامية الاحتفاظ بالوجبة الشاهدة بجميع مكوناتها الغذائية لمدة خمسة (5) أيام متتالية من تاريخ الاستهلاك لأسباب رقابية وصحية؛", "عدم استلام اللحوم بكافة أنواعها إلا بعد الحصول على رخصة وإجازة بيطرية رسمية تثبت سلامتها وصلاحيتها للاستهلاك؛", "التقيد الصارم بجدول التغذية الأسبوعي المعتمد والمؤشر عليه من طبيب وحدة الكشف والمتابعة؛", "منع استهلاك التبغ، بكل أنواعه، منعاً باتاً داخل قاعة الإطعام، قاعة الطبخ، ومخازن الأغذية.", "المادة 25: يلتزم التلاميذ بتناول وجباتهم الغذائية بهدوء وتجنب إحداث الضجيج أو تبذير الطعام.", "يمنع إدخال أو إخراج الأطعمة من المطعم.", "يتحمل الولي أو الوصي الشرعي الكلفة المالية لأي إتلاف متعمد لأدوات الأكل والأواني.", "المادة 26: يخضع التلاميذ المستفيدون من النظامين الداخلي أو نصف الداخلي لضوابط المراقبة والحراسة المستمرة أثناء فترات تواجدهم بالمؤسسة التعليمية، المطعم أو بالمراقد، من طرف سلك مساعدي ومشرفي التربية في المتوسط والثانوي والمربي المتخصص في الابتدائي.", "المادة 27: تسهر المؤسسة التعليمية بالتنسيق مع الجماعات المحلية على تأطير خدمات النقل المدرسي.", "تخضع الرحلات والخرجات البيداغوجية إلى الترخيص المسبق والتأطير اللازمين.", "الفصل الخامس الوقاية، الصحة، النظافة والأمن", "المادة 28: يشارك مدير المؤسسة التعليمية، بالتنسيق مع مصالح الحماية المدنية، في إعداد مخططات الوقاية والأمن وتنظيم التدخلات والإسعافات في حالات الكوارث الطبيعية والمخاطر الكبرى، ويعلق هذا المخطط وجوباً في أماكن بارزة بالمؤسسة التعليمية.", "المادة 29: في حالة وقوع حوادث أو اضطرابات تهدد أمن الأشخاص والممتلكات، يقوم مدير المؤسسة باتخاذ التدابير الاستعجالية الضرورية بالتنسيق مع المصالح المعنية.", "المادة 30: يلتزم مدير المؤسسة التعليمية وأفراد الجماعة التربوية بالتبليغ عن كل وضعية من شأنها المساس بحقوق الطفل أو سلامته، وفقاً للتشريع والتنظيم المعمول بها، ولا سيما إخطار الهيئة الوطنية لحماية وترقية الطفولة عن طريق الخط الأخضر 1111، عند الاقتضاء، مع مراعاة مصلحة الطفل الفضلى والسرية المهنية.", "المادة 31: يساهم التلاميذ وكافة أعضاء الجماعة التربوية في الحفاظ على نظافة المؤسسة التعليمية، والمشاركة التطوعية في تزيينها وزرع المساحات الخضراء لحماية البيئة المدرسية.", "المادة 32: يمنع على التلاميذ جلب وإحضار الأشياء الثمينة والمبالغ المالية وغيرها، ولا تتحمل المؤسسة التعليمية أي مسؤولية في حالة ضياعها أو سرقتها.", "المادة 33: يلتزم أفراد الجماعة التربوية بالحضور بمظهر نظيف وهندام لائق، لا يخالف الآداب العامة، ويتيح التعرف عليهم، ويتناسب مع وقار المؤسسة التربوية.", "يمنع منعاً باتاً على التلاميذ الظهور بقصات شعر غريبة أو استعمال مساحيق الزينة، أو ارتداء القبعات والملابس الممزقة والمنافية للآداب العامة.", "المادة 34: يلتزم الطاقم البيداغوجي في مرحلة التعليم الابتدائي بإجراء فحص صباحي دوري لنظافة الجسم والأظافر والشعر للتلاميذ كإجراء صحي وقائي.", "المادة 35: يُحظر في المؤسسة التعليمية كل السلوكيات المنافية للآداب العامة، لا سيما:", "حيازة، إدخال، أو استعمال الأسلحة البيضاء والقوارير والأنابيب الزجاجية، المفرقعات، الألعاب النارية، أو أي أدوات أو مواد تشكل خطراً على سلامة أعضاء الجماعة التربوية وأمن المؤسسة التعليمية؛", "حيازة، استهلاك، أو ترويج كافة أنواع التبغ، السجائر الإلكترونية، المخدرات، والمؤثرات العقلية، ومشروبات الطاقة، في الوسط المدرسي؛", "الترويج أو الانخراط في التحديات الرقمية الخطيرة.", "المادة 36: يخضع تلاميذ مؤسسات التربية والتعليم، باستثناء تلاميذ مرحلة التعليم الابتدائي، ما لم تقتض ذلك مصلحتهم الفضلى، إلى تحاليل الكشف عن تعاطي المخدرات و/أو المؤثرات العقلية.", "المادة 37: يمكن مدير المؤسسة التعليمية أن يطلب إجراء تحاليل الكشف عن تعاطي المخدرات و/أو المؤثرات العقلية من طرف أطباء وحدات الكشف والمتابعة وفقا للمرسوم التنفيذي رقم 26-77 المؤرخ في 25 رجب عام 1447 الموافق 14 جانفي سنة 2026 الذي يحدد شروط وكيفيات الكشف عن تعاطي المخدرات و/أو المؤثرات العقلية بالمؤسسات التربوية والتعليمية والتكوينية، في حالتين:", "إدراج التحاليل ضمن الفحوص الدورية المبرمجة مع وحدات الكشف والمتابعة؛", "ظهور اختلال في السلوك أو سلوك عدواني لدى التلميذ تجاه زملائه و/أو الأساتذة و/أو الطاقم الاداري، أو وجود اشتباه معقول على تعاطيه المخدرات و/أو المؤثرات العقلية وفقا لملاحظات الأساتذة و/ أو الطاقم الإداري وكذا أطباء وحدات الكشف والمتابعة أثناء الفحوصات الصحية الدورية.", "المادة 38: تخضع كيفية إجراء تحاليل الكشف عن تعاطي المخدرات و/أو المؤثرات العقلية للإجراءات التالية:", "بالنسبة للتلميذ القاصر: يتولى مدير المؤسسة التعليمية استدعاء الولي أو الوصي الشرعي، وعرض الحالة عليه للتشاور بشأن التدابير المناسبة الواجب اتخاذها، مع اشتراط الحصول على موافقته الكتابية والواضحة على إخضاع التلميذ لإجراء التحاليل. وفي حال رفضه، يطلب مدير المؤسسة مباشرة أو عبر مديرية التربية، موافقة قاضي الأحداث المختص إقليمياً مع إشعار الممثل الشرعي بذلك؛", "بالنسبة للتلميذ البالغ سن الرشد المدني: يطلب مدير المؤسسة التعليمية موافقته الشخصية على إجراء التحاليل في حضور وليه أو وصيه الشرعي، وفي حال امتناعه عن الموافقة ضمن الآجال المحددة، يُخطر بأن هذا الامتناع يؤدي وجوباً إلى إحالته على المجلس التأديبي.", "المادة 39: إذا أظهرت نتائج التحاليل وجود تعاطي المخدرات و/أو المؤثرات العقلية، يُعلَم الولي أو الوصي الشرعي للتلميذ القاصر بذلك، وعند الاقتضاء، قاضي الأحداث الذي وافق على إخضاع التلميذ للتحليل، كما يُعلَم التلميذ البالغ سن الرشد المدني بذلك.", "المادة 40: يُعلَم الولي أو الوصي الشرعي للتلميذ القاصر، أو التلميذ البالغ سن الرشد المدني، بوجوب الخضوع للتدابير العلاجية المنصوص عليها في القانون رقم 04-18 المؤرخ في 13 ذي القعدة عام 1425 الموافق 25 ديسمبر سنة 2004، المتعلق بالوقاية من المخدرات والمؤثرات العقلية وقمع الاستعمال والاتجار غير المشروعين بها، المعدل والمتمم.", "المادة 41: يمنع منعاً باتاً اتخاذ أي إجراءات عقابية، تأديبية، إقصائية، أو تهميش بيداغوجي من طرف إدارة المؤسسة ضد التلميذ الذي تظهر نتائج تحاليله إيجابية.", "يخضع كل ما يتعلق بإجراءات التحاليل ونتائجها للسرية المهنية التامة. ويتعرّض كل شخص يقوم بإفشاء المعلومات المرتبطة بها أو يمس بالحياة الخاصة للتلميذ إلى العقوبات المنصوص عليها في التشريع والتنظيم المعمول بهما.", "الفصل السادس تقنين استعمال وسائل الإعلام والاتصال المؤسساتية والشخصية", "المادة 42: تُستعمل أجهزة الإعلام الآلي واللوحات الإلكترونية التابعة للمؤسسة التربوية للأغراض التعليمية والبيداغوجية حصراً، وتحت الإشراف المباشر للأستاذ المسؤول، مع ضرورة المحافظة على سلامة التجهيزات والبرمجيات المعتمدة.", "المادة 43: يُمنع منعاً باتاً على التلاميذ إحضار أو استعمال الهواتف النقالة الشخصية، وأجهزة الاتصال الذكية، أو وسائل التصوير والتسجيل داخل قاعات الدراسة والمرافق البيداغوجية.", "وفي حالة الضرورة البيداغوجية القصوى، يخضع استعمال وسائل تكنولوجيات الإعلام والاتصال لترخيص كتابي مسبق تسلمه إدارة المؤسسة التعليمية. ويترتب على مخالفة هذه الأحكام حجز الجهاز مؤقتاً واستدعاء الولي.", "المادة 44: يُمنع منعاً باتاً إجراء أي تصوير، أو تسجيل سمعي أو بصري، أو نشر صور تخص التلاميذ أو الأساتذة أو الموظفين أو مرافق المؤسسة التعليمية على شبكات التواصل الاجتماعي أو الأنظمة الرقمية الشخصية، دون الحصول على ترخيص رسمي كتابي من مدير التربية.", "يلتزم الجميع باحترام خصوصية أفراد الجماعة التربوية وقواعد السر المهني.", "الفصل السابع الحقوق والواجبات", "المادة 45: يتمتع التلاميذ بالحقوق التالية:", "التعلم واكتساب المعارف والمهارات والقيم؛", "المساواة وتكافؤ الفرص بين الجميع، بما في ذلك التلاميذ ذوو الاحتياجات الخاصة؛", "الاستفادة من الحصص الدراسية المقررة وفق البرامج والمقررات الرسمية؛", "حسن الاستقبال والحماية من كل أشكال العنف أو التمييز؛", "السلامة الجسدية والمعنوية؛", "المتابعة الطبية بالتنسيق مع المصالح المختصة؛", "حرية التعبير في إطار التشريع والتنظيم المعمول بهما؛", "التمثيل من طرف مندوبي الأقسام؛", "الإعلام والاتصال.", "المادة 46: يلتزم التلاميذ بالواجبات والضوابط التالية:", "احترام قواعد الانضباط والمواظبة؛", "استظهار بطاقة التلميذ أو دفتر المراسلة عند الدخول إلى المؤسسة التعليمية في مرحلتي التعليم المتوسط والثانوي؛", "ارتداء المئزر المدرسي طوال فترة تواجده بالمؤسسة؛", "الالتزام بارتداء لباس نظيف ولائق ومناسب للوسط المدرسي؛", "ضرورة احضار الأدوات والكتب المدرسية والبدلة الرياضية، حسب الجدول الزمني؛", "احترام كافة أعضاء الجماعة التربوية؛", "الامتناع عن كل شكل من أشكال العنف المخل بالنظام العام للمؤسسة؛", "الامتناع عن تعاطي المخدرات و/أو المؤثرات العقلية؛", "الامتناع عن كل أنواع الغش والتزوير؛", "الامتناع عن استهلاك التبغ، بكل أنواعه، داخل مؤسسة التربية والتعليم؛", "المحافظة على الهياكل والتجهيزات والوسائل التعليمية؛", "المحافظة على نظافة المؤسسة ومحيطها.", "المادة 47: يستفيد الموظفون من الحقوق الآتية:", "احترام كرامتهم ومكانتهم المهنية؛", "المشاركة في تسيير مؤسسة التربية والتعليم ضمن أطر المجالس والنصوص المنظمة؛", "المشاركة في مختلف العمليات التكوينية؛", "الإعلام والاتصال؛", "ممارسة النشاط النقابي وفقاً للأحكام التشريعية والتنظيمية المعمول بها، دون المساس باستمرار الخدمة العمومية.", "المادة 48: يلتزم الموظفون والأساتذة بالواجبات الآتية:", "تطبيق المناهج والبرامج التعليمية والمواقيت والتوجيهات الرسمية؛", "تبني المقاربات البيداغوجية المنصوص عليها في البرامج، ووضعيات التعليم والتعلم التي تسمح بالمشاركة التفاعلية للتلاميذ؛", "المشاركة في مختلف المجالس البيداغوجية والإدارية المنظمة للحياة المدرسية، وكذا في الاجتماعات المنعقدة داخل مؤسسة التربية والتعليم؛", "اعتماد الأساليب التربوية المناسبة في تعاملهم مع التلاميذ، ونبذ كل شكل من أشكال الإساءة أو الإهانة اللفظية والمعنوية التي يمكن أن تمس بشخصهم وكرامتهم؛", "التحلي بسلوك مثالي والالتزام بارتداء لباس لائق ومناسب للوسط المدرسي؛", "ارتداء الأساتذة للمئزر أثناء أداء مهامهم؛", "عدم ممارسة أي نشاط سياسي أو حزبي، أو أي سلوك ذي تأثير إيديولوجي داخل مؤسسة التربية والتعليم؛", "الامتناع عن استهلاك التبغ، بكل أنواعه، داخل مؤسسة التربية والتعليم باعتبارها مرفقا عاما؛", "الامتناع عن تعاطي المخدرات و/أو المؤثرات العقلية.", "يُمنع استعمال الهواتف النقالة داخل قاعات الدراسة إلا لأغراض بيداغوجية.", "المادة 49: يستفيد أولياء التلاميذ من الحقوق الآتية:", "إعلامهم بالنظام الداخلي للمؤسسة التعليمية؛", "إعلامهم بجدول توقيت التلاميذ والتغييرات التي قد تطرأ عليها؛", "إعلامهم بتأخرات وغيابات أبنائهم والسلوكات التي تسجل عليهم؛", "إعلامهم بالنتائج المدرسية التي يتحصل عليها أبناؤهم طيلة السنة الدراسية؛", "المساهمة في إنجاز الأنشطة المكملة للمدرسة المقترحة على التلاميذ، وكذا الأعمال ذات الطابع الاجتماعي التي تقوم بها المؤسسة التعليمية.", "المادة 50: يلتزم أولياء التلاميذ بما يلي:", "الإمضاء على النسخة المكتوبة من النظام الداخلي المعتمد لدى المؤسسة واستلام نسخة منه؛", "التسجيل في فضاء الأولياء ضمن النظام المعلوماتي لوزارة التربية الوطنية، وتفعيله على مستوى إدارة المؤسسة التعليمية؛", "متابعة تمدرس أبنائهم وسلوكهم وانضباطهم عبر مختلف الوثائق المعتمدة و/أو عبر فضاء الأولياء ضمن الأرضية الرقمية الرسمية، أو بالتقرب الدوري من المؤسسة التعليمية؛", "احترام رزنامة استقبال الأساتذة؛", "الاستجابة لاستدعاءات إدارة المؤسسة التعليمية؛", "احترام كافة موظفي المؤسسة، وتجنب أي سلوك عنيف أو مخل بسيرها الحسن؛", "يتحمل الأولياء تعويض الإتلاف المثبت للتجهيزات والوسائل التعليمية التي يتسبب فيها أبناؤهم؛", "التصريح الكتابي بالوضعية الصحية للتلميذ عند تسجيله، مرفقاً بالملف الطبي، لا سيما في حالات الأمراض المزمنة أو العصبية أو طيف التوحد أو الإعاقات، لتمكين المؤسسة التعليمية من اتخاذ التدابير الوقائية المناسبة؛", "التصريح الفوري عن أي مرض معد يصيب ابنه، لاتخاذ التدابير الوقائية المناسبة، ولا يمكن للتلميذ استئناف الدراسة إلا بعد الموافقة الطبية؛", "الموافقة الكتابية والصريحة على إخضاع التلميذ لتحاليل الكشف عن تعاطي المخدرات و/أو المؤثرات العقلية.", "المادة 51: تتخذ إدارة المؤسسة التعليمية كل التدابير اللازمة لتسهيل إنشاء جمعية أولياء التلاميذ، باعتبارها همزة وصل بين الأسرة والمؤسسة التعليمية، وتوطيد العلاقة بينهما.", "يمكن لجمعية أولياء التلاميذ الإعلان عن برامج أنشطتها داخل المؤسسة التعليمية، وذلك بعد موافقة إدارة المؤسسة، التي تحدد بدورها الفضاء المخصص لهذا الغرض.", "الفصل الثامن أحكام خاصة", "المادة 52: تتكفل المؤسسة التعليمية بالتلاميذ ذوي الاحتياجات الخاصة أو الذين يعانون من أمراض مزمنة، وذلك بتقديم الرعاية التربوية والبيداغوجية الملائمة، وتسهيل إدماجهم، ومراعاة ظروفهم الصحية الخاصة أثناء اجتياز الفروض والاختبارات وحصص التربية البدنية والرياضية، بناءً على تقارير طبية معتمدة، مع الالتزام التام بواجب التحفظ والسرية.", "المادة 53: في حالة وقوع حادث مدرسي لأي تلميذ داخل المؤسسة التعليمية أو أثناء نشاط خارجي مرخص، تلتزم الإدارة باتخاذ الإجراءات الفورية لتقديم الإسعافات الأولية ونقله إلى المصالح الصحية، وإعلام الأولياء، وتبليغ مدير التربية، والقيام بالتصريح القانوني بالحادث لدى تعاضدية الحوادث المدرسية في الآجال المحددة.", "المادة 54: يتوجب على مدير المؤسسة التحلي باليقظة، وتكريس واجب إخطار مدير التربية والسلطات المعنية في حالة وجود خطر أو الاشتباه في وجوده، من شأنه المساس بالسلامة الجسدية أو النفسية أو الاجتماعية أو الأخلاقية للتلميذ.", "الفصل التاسع أحكام ختامية", "المادة 55: يُشهر النظام الداخلي داخل المؤسسة، ويُتاح إلكترونياً ضمن حسابات مديري المؤسسات التعليمية وأساتذتها، وكذا عبر فضاء الأولياء، بما يضمن تمكين أفراد الجماعة التربوية من الاطلاع على أحكامه."];
const chapterInfo=[
 ['أحكام عامة','مبادئ وضوابط عامة للحياة المدرسية','📘'],['تنظيم المؤسسة وسيرها','الدخول والحراسة والأنشطة وتنظيم الفضاءات','🏫'],['تنظيم الحياة المدرسية','الغيابات والتأخرات والدراسة والتقييم','🎓'],['المطعم والنظام الداخلي والنقل','الإطعام والنظافة والمراقبة والنقل المدرسي','🍽️'],['الوقاية والصحة والنظافة والأمن','السلامة والصحة والوقاية وحماية التلاميذ','🛡️'],['استعمال وسائل الإعلام والاتصال','الأجهزة والخصوصية وقواعد الاستعمال الرقمي','💻'],['الحقوق والواجبات','حقوق وواجبات التلاميذ والموظفين والأولياء','⚖️'],['أحكام خاصة','الرعاية والحوادث المدرسية والتبليغ عن المخاطر','🤝'],['أحكام ختامية','الإشهار والإتاحة الإلكترونية للنظام الداخلي','📌']
];
function parse(){let out=[],c=null,a=null;for(const raw of sourceLines){const line=String(raw).trim();if(!line||line==='النظام الداخلي للمؤسسة')continue;if(line.startsWith('الفصل')){c={full:line,articles:[]};out.push(c);a=null;continue}const m=line.match(/^المادة\s*(الأولى|\d+)/);if(m){const n=m[1]==='الأولى'?1:Number(m[1]);a={n,lines:[line.replace(/^المادة\s*(?:الأولى|\d+)\s*:?[ ]*/,'')]};c.articles.push(a);continue}if(a)a.lines.push(line)}return out}
const data=parse();
const $=x=>document.getElementById(x);const homeView=$('homeView'),searchView=$('searchView'),reader=$('reader');
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const el=$('chapters');el.innerHTML='';data.forEach((c,i)=>{const info=chapterInfo[i];const title=c.full.trim();const b=document.createElement('button');b.className='chapter';b.innerHTML=`<div class="chapter-top"><span class="num">${i+1}</span></div><h3>${esc(title)}</h3>`;b.onclick=()=>open(i);el.appendChild(b)})}
function open(i){document.body.classList.remove('home-mode');document.body.classList.add('reader-mode');const c=data[i],info=chapterInfo[i];$('badge').textContent=i+1;$('readerTitle').textContent=info[0];$('readerMeta').textContent=`الفصل ${i+1} · ${c.articles.length} مادة`;$('articles').innerHTML=c.articles.map((a,ai)=>`<article class="article" id="article-${a.n}"><div class="article-head"><span class="article-number">${a.n}</span><span>المادة ${a.n}</span></div><div class="article-body">${a.lines.map((x,j)=>{const bullet=/^[*•]/.test(x);return `<p class="${bullet?'bullet':''}">${esc(x.replace(/^[*•]\s*/,''))}</p>`}).join('')}</div></article>`).join('')+`<div class="reader-nav"><button onclick="open(${Math.max(0,i-1)})" ${i===0?'disabled':''}>→ الفصل السابق</button><button onclick="open(${Math.min(data.length-1,i+1)})" ${i===data.length-1?'disabled':''}>الفصل التالي ←</button></div>`;homeView.hidden=true;searchView.hidden=true;reader.hidden=false;window.scrollTo(0,0)}
function goHome(){reader.hidden=true;searchView.hidden=true;homeView.hidden=false;document.body.classList.remove('reader-mode');document.body.classList.add('home-mode');window.scrollTo(0,0)}
function highlight(text,q){let s=esc(text);q.split(/\s+/).filter(Boolean).slice(0,5).forEach(w=>{const z=esc(w);s=s.replace(new RegExp(`(${z})`,'gi'),'<mark>$1</mark>')});return s}
function doSearch(v){const q=v.trim().toLowerCase();if(!q){goHome();return}let hits=[];data.forEach((c,ci)=>c.articles.forEach(a=>{const txt=a.lines.join(' ');if(txt.toLowerCase().includes(q)||String(a.n)===q)hits.push({ci,a,txt})}));document.body.classList.remove('home-mode');document.body.classList.add('reader-mode');homeView.hidden=true;reader.hidden=true;searchView.hidden=false;$('searchInfo').textContent=`${hits.length} نتيجة مطابقة لـ «${v}»`;$('results').innerHTML=hits.length?hits.map(h=>`<button class="result" onclick="open(${h.ci})"><strong>المادة ${h.a.n}</strong> <small>— الفصل ${h.ci+1}</small><p>${highlight(h.txt.slice(0,300),v)}${h.txt.length>300?'…':''}</p></button>`).join(''):'<div class="panel empty">لا توجد نتائج مطابقة. جرّب كلمة أخرى مثل: الغياب، المطعم، الحقوق، الهاتف.</div>'}
$('q').addEventListener('input',e=>doSearch(e.target.value));$('clear').onclick=()=>{$('q').value='';goHome()};$('home').onclick=goHome;$('close').onclick=goHome;$('bhome').onclick=goHome;$('bsearch').onclick=()=>{$('q').focus();window.scrollTo(0,0)};$('btop').onclick=()=>window.scrollTo(0,0);
function font(d){let n=+(localStorage.getItem('reg-font')||17)+d;n=Math.max(15,Math.min(21,n));document.documentElement.style.setProperty('--font',n+'px');localStorage.setItem('reg-font',n)}$('larger').onclick=()=>font(1);$('smaller').onclick=()=>font(-1);if(localStorage.getItem('reg-font'))document.documentElement.style.setProperty('--font',localStorage.getItem('reg-font')+'px');
$('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('reg-dark',document.body.classList.contains('dark')?'1':'0');$('theme').textContent=document.body.classList.contains('dark')?'☀':'☾'};if(localStorage.getItem('reg-dark')==='1'){$('theme').textContent='☀';document.body.classList.add('dark')}
let deferred=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').hidden=false});$('install').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('install').hidden=true};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));document.body.classList.add('home-mode');render();
</script>

<script>
/* ===== ROBUST PREVIOUS / NEXT CHAPTER NAVIGATION ===== */
(function(){
  function chapterTitles(){
    return Array.from(document.querySelectorAll('#chapters .chapter h3'))
      .map(function(x){ return x.textContent.trim(); });
  }

  function currentChapterIndex(){
    var reader = document.getElementById('reader');
    if (!reader) return -1;
    var idx = parseInt(reader.getAttribute('data-chapter-index'), 10);
    return Number.isFinite(idx) ? idx : -1;
  }

  function openChapterAt(i){
    var cards = document.querySelectorAll('#chapters .chapter');
    if (!cards.length || i < 0 || i >= cards.length) return;

    /* Trigger the same chapter-opening logic used by the cards. */
    cards[i].click();

    /* Always start at the top of the selected chapter. */
    window.scrollTo(0,0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  }

  document.addEventListener('click', function(e){
    var target = e.target.closest ? e.target.closest('#prevChapter,#nextChapter') : null;
    if (!target) return;

    e.preventDefault();
    e.stopPropagation();

    var idx = currentChapterIndex();
    var count = document.querySelectorAll('#chapters .chapter').length;
    if (idx < 0 || !count) return;

    if (target.id === 'prevChapter' && idx > 0) {
      openChapterAt(idx - 1);
    } else if (target.id === 'nextChapter' && idx < count - 1) {
      openChapterAt(idx + 1);
    }
  }, true);

  /* Watch the reader for the currently opened chapter and store its index. */
  var observer = new MutationObserver(function(){
    var reader = document.getElementById('reader');
    if (!reader) return;
    var title = reader.querySelector('.reader-title, h1, h2');
    if (!title) return;

    var titles = chapterTitles();
    var t = title.textContent.trim();
    var idx = titles.findIndex(function(x){ return x === t; });
    if (idx >= 0) reader.setAttribute('data-chapter-index', String(idx));

    var prev = document.getElementById('prevChapter');
    var next = document.getElementById('nextChapter');
    if (prev) prev.disabled = idx <= 0;
    if (next) next.disabled = idx < 0 || idx >= titles.length - 1;
  });

  document.addEventListener('DOMContentLoaded', function(){
    var reader = document.getElementById('reader');
    if (reader) observer.observe(reader, {childList:true, subtree:true, attributes:true});
  });
})();
</script>


<script>
/* ===== PWA INSTALL HANDLER ===== */
(function(){
  let deferredPrompt = null;
  const btn = () => document.getElementById('installApp');

  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches ||
           window.navigator.standalone === true;
  }

  function refreshInstallButton(){
    const b = btn();
    if (!b) return;
    b.hidden = isStandalone() || !deferredPrompt;
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    refreshInstallButton();
  });

  window.addEventListener('appinstalled', function(){
    deferredPrompt = null;
    refreshInstallButton();
  });

  document.addEventListener('DOMContentLoaded', function(){
    const b = btn();
    if (!b) return;
    b.addEventListener('click', async function(){
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch(e) {}
      deferredPrompt = null;
      refreshInstallButton();
    });
    refreshInstallButton();
  });

  window.addEventListener('pageshow', refreshInstallButton);
})();
</script>
